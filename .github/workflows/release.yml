name: Release

# Pushing a tag such as v0.2.0 tests the app, builds LoLProComp.exe and publishes it as a GitHub release.
# Installed applications look for the latest release at startup and update themselves from it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm ci --prefix frontend

      - name: Backend tests
        shell: pwsh
        run: python -m pytest -q
        working-directory: backend

      - name: Frontend tests
        shell: pwsh
        run: npm test --prefix frontend

      - name: Build LoLProComp.exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./build.ps1 -Version $version -OutDir "$PWD/release"
          $hash = (Get-FileHash release/LoLProComp.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LoLProComp.exe" | Out-File -Encoding ascii release/LoLProComp.exe.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LoLProComp.exe
            release/LoLProComp.exe.sha256
          generate_release_notes: true
