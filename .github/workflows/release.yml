name: Release

# Pushing a tag such as v0.2.0 tests the app, builds LoLProComp.exe and its installer LoLProComp-Setup.exe and
# publishes them as a GitHub release. Installed applications look for the latest release at startup and update
# themselves from LoLProComp.exe (portable or installed alike).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm ci --prefix frontend

      - name: Backend tests
        shell: pwsh
        run: python -m pytest -q
        working-directory: backend

      - name: Frontend tests
        shell: pwsh
        run: npm test --prefix frontend

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build LoLProComp.exe and LoLProComp-Setup.exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./build.ps1 -Version $version -OutDir "$PWD/release" -Installer
          foreach ($name in "LoLProComp.exe", "LoLProComp-Setup.exe") {
            $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Out-File -Encoding ascii "release/$name.sha256"
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LoLProComp.exe
            release/LoLProComp.exe.sha256
            release/LoLProComp-Setup.exe
            release/LoLProComp-Setup.exe.sha256
          generate_release_notes: true
